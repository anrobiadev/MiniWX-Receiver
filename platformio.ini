; PlatformIO - GeekMagic SmallTV-Ultra (ESP8266/ESP12F + ST7789V 240x240)
; -------------------------------------------------------------------
; Pinout REAL al placii (sursa: slavka08/esp-mini_screen, GeekMagic SmallTV-Ultra):
;   MOSI = GPIO13 (HSPI, fix)
;   SCLK = GPIO14 (HSPI, fix)
;   CS   = -1     (legat la masa pe PCB)
;   DC   = GPIO0
;   RST  = GPIO2
;   BL   = GPIO5  (backlight, ACTIV pe LOW)
;
; Toata configurarea TFT_eSPI se face aici prin build_flags
; (nu trebuie editat User_Setup.h din librarie).
; -------------------------------------------------------------------

[env:smalltv]
platform      = espressif8266
board         = esp12e
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    -DUSER_SETUP_LOADED=1

    ; --- Driver ecran ---
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240

    ; --- Pini (maparea reala a placii) ---
    -DTFT_CS=-1       ; CS legat la masa pe PCB
    -DTFT_DC=0        ; GPIO0
    -DTFT_RST=2       ; GPIO2
    -DTFT_BL=5        ; GPIO5 backlight
    -DTFT_BACKLIGHT_ON=LOW   ; backlight activ pe LOW

    ; --- Fonturi ---
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1

    ; --- Viteza SPI (scade la 27000000 daca apar artefacte) ---
    -DSPI_FREQUENCY=40000000

; ===================================================================
;  DEPANARE:
;   - Culori inversate (rosu apare cyan): adauga  -DTFT_INVERSION_OFF=1
;     (ST7789 IPS porneste de obicei cu inversare ON; daca e gresit, o opresti)
;   - Imagine rotita/oglindita: regleaza  tft.setRotation(0..3)  in cod
;   - Artefacte/zgomot pe ecran: scade SPI_FREQUENCY la 27000000 sau 20000000
; ===================================================================